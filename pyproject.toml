[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rover"
version = "0.1.0"
description = "A general-purpose inference engine with resumable sessions"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.6,<2.12",
    "safetensors>=0.5",
    "numpy>=1.26",
    "tokenizers>=0.22,<0.23",
    "jinja2>=3.1",
    "pillow>=10",
    "torchvision>=0.21",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "setuptools>=75", "ninja>=1.11"]

[project.scripts]
rover = "rover.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rover"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { path = "vendor/jetson/torch-2.11.0-cp310-cp310-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' and (platform_machine != 'aarch64' or python_version != '3.10')" },
]
torchvision = [
  { path = "vendor/jetson/torchvision-0.26.0-cp310-cp310-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" },
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' and (platform_machine != 'aarch64' or python_version != '3.10')" },
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.sdist]
include = ["rover", "scripts", "tests", "README.md", "pyproject.toml", "uv.lock", ".python-version"]
exclude = ["**/__pycache__", "**/*.so", "**/*.pyc"]
