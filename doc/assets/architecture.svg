<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 665" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .font { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .layer-box { rx: 10; ry: 10; stroke-width: 1.5; }
      .layer-title { font-size: 14px; font-weight: 700; text-anchor: middle; }
      .group-box { rx: 8; ry: 8; stroke-width: 1.3; }
      .group-title { font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .sub-box { fill: #ffffff; rx: 6; ry: 6; stroke-width: 1.2; }
      .sub-title { font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .sub-desc { font-size: 11.2px; fill: #475569; text-anchor: middle; }
      .arrow { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
      .bi-arrow { stroke: #64748b; stroke-width: 1.8; fill: none; marker-start: url(#arrowhead-rev); marker-end: url(#arrowhead); }
      .stage-arrow { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .edge-label { font-size: 11px; fill: #475569; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="6.5" markerHeight="5" refX="5.5" refY="2.5" orient="auto">
      <polygon points="0 0, 6.5 2.5, 0 5" fill="#64748b" />
    </marker>
    <marker id="arrowhead-rev" markerWidth="6.5" markerHeight="5" refX="1" refY="2.5" orient="auto">
      <polygon points="6.5 0, 0 2.5, 6.5 5" fill="#64748b" />
    </marker>
    <marker id="arrowhead-green" markerWidth="7" markerHeight="5.5" refX="6" refY="2.75" orient="auto">
      <polygon points="0 0, 7 2.75, 0 5.5" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="960" height="665" rx="12" />

  <!-- Title -->
  <text class="font title" x="480" y="32">Rover 系统总体架构</text>

  <!-- ==================== 1. 接入与多模态预处理层 ==================== -->
  <rect class="layer-box" x="36" y="48" width="888" height="96" fill="#eff6ff" stroke="#93c5fd" />
  <text class="font layer-title" x="480" y="69" fill="#1d4ed8">接入与多模态预处理层</text>

  <rect class="sub-box" x="54" y="80" width="246" height="50" stroke="#bfdbfe" />
  <text class="font sub-title" x="177" y="101">命令行接口 (CLI)</text>
  <text class="font sub-desc" x="177" y="119">启动推理 · 断点恢复 · 状态查看</text>

  <rect class="sub-box" x="316" y="80" width="256" height="50" stroke="#bfdbfe" />
  <text class="font sub-title" x="444" y="101">Python 编程接口 (API)</text>
  <text class="font sub-desc" x="444" y="119">引擎会话管理 · 流式生成回调</text>

  <rect class="sub-box" x="588" y="80" width="318" height="50" stroke="#bfdbfe" />
  <text class="font sub-title" x="747" y="101">多模态输入预处理器</text>
  <text class="font sub-desc" x="747" y="119">本地分词 · 对话模板渲染 · 图像切块与视觉占位对齐</text>

  <!-- Arrow: Top -> Core -->
  <line class="arrow" x1="480" y1="144" x2="480" y2="168" />

  <!-- ==================== 2. 核心执行与控制层 ==================== -->
  <rect class="layer-box" x="36" y="170" width="888" height="324" fill="#f8fafc" stroke="#94a3b8" />
  <text class="font layer-title" x="480" y="191" fill="#0f172a">核心执行与协同控制层</text>

  <!-- 2A. 多模态分阶段推理流水线 -->
  <rect class="group-box" x="54" y="203" width="852" height="104" fill="#f0fdf4" stroke="#86efac" />
  <text class="font group-title" x="480" y="223" fill="#15803d">多模态三阶段可恢复推理流水线</text>

  <!-- Stage 1: Vision -->
  <rect class="sub-box" x="70" y="233" width="250" height="62" stroke="#bbf7d0" />
  <text class="font sub-title" x="195" y="254">1. 视觉编码阶段 (Vision)</text>
  <text class="font sub-desc" x="195" y="272">提取图像特征 · 按层边界保存隐状态</text>
  <text class="font sub-desc" x="195" y="287">完成后卸载视觉权重释放显存</text>

  <line class="stage-arrow" x1="320" y1="264" x2="352" y2="264" />

  <!-- Stage 2: Prefill -->
  <rect class="sub-box" x="355" y="233" width="250" height="62" stroke="#bbf7d0" />
  <text class="font sub-title" x="480" y="254">2. 分块预填充阶段 (Prefill)</text>
  <text class="font sub-desc" x="480" y="272">文本块 × 网络层二维网格推进</text>
  <text class="font sub-desc" x="480" y="287">在块边界持久化 KV 与边界隐状态</text>

  <line class="stage-arrow" x1="605" y1="264" x2="637" y2="264" />

  <!-- Stage 3: Decode -->
  <rect class="sub-box" x="640" y="233" width="250" height="62" stroke="#bbf7d0" />
  <text class="font sub-title" x="765" y="254">3. 自回归解码阶段 (Decode)</text>
  <text class="font sub-desc" x="765" y="272">CUDA Graph 单步计算图捕获与重放</text>
  <text class="font sub-desc" x="765" y="287">多词元批量落盘 · 异步 KV 压缩热切换</text>

  <!-- Internal Arrows between Pipeline and Scheduling / Cache-State -->
  <line class="bi-arrow" x1="261" y1="311" x2="261" y2="340" />
  <line class="bi-arrow" x1="699" y1="311" x2="699" y2="340" />

  <!-- 2B Left: 预填充与恢复协同调度器 -->
  <rect class="group-box" x="54" y="344" width="414" height="136" fill="#fefce8" stroke="#fde047" />
  <text class="font group-title" x="261" y="365" fill="#a16207">计算与 I/O 协同调度器</text>

  <rect class="sub-box" x="68" y="376" width="188" height="90" stroke="#fef08a" />
  <text class="font sub-title" x="162" y="399">双流解耦并发执行</text>
  <text class="font sub-desc" x="162" y="419">计算流与存储读写流并行</text>
  <text class="font sub-desc" x="162" y="436">支持按块 / 按层 / 调度模式</text>
  <text class="font sub-desc" x="162" y="453">掩盖权重与检查点读写延迟</text>

  <rect class="sub-box" x="268" y="376" width="186" height="90" stroke="#fef08a" />
  <text class="font sub-title" x="361" y="399">依赖感知动态规划排程</text>
  <text class="font sub-desc" x="361" y="419">面向非结构化阶梯断点前沿</text>
  <text class="font sub-desc" x="361" y="436">延迟加载隐状态 · 合并同层 I/O</text>
  <text class="font sub-desc" x="361" y="453">求解最优恢复与预填充顺序</text>

  <!-- 2B Right: 会话状态与多格式 KV 缓存 -->
  <rect class="group-box" x="492" y="344" width="414" height="136" fill="#faf5ff" stroke="#d8b4fe" />
  <text class="font group-title" x="699" y="365" fill="#7e22ce">会话状态与多格式 KV 缓存管理</text>

  <rect class="sub-box" x="506" y="376" width="186" height="90" stroke="#e9d5ff" />
  <text class="font sub-title" x="599" y="399">分阶段状态与检查点</text>
  <text class="font sub-desc" x="599" y="419">追踪阶段、层与分块完成进度</text>
  <text class="font sub-desc" x="599" y="436">区分长生命周期 KV 与瞬态隐状态</text>
  <text class="font sub-desc" x="599" y="453">中断后快速校验并重建上下文</text>

  <rect class="sub-box" x="704" y="376" width="188" height="90" stroke="#e9d5ff" />
  <text class="font sub-title" x="798" y="399">多格式 KV 缓存引擎</text>
  <text class="font sub-desc" x="798" y="419">Dense：原生半精度稠密缓存</text>
  <text class="font sub-desc" x="798" y="436">KIVI：低比特分组非对称量化</text>
  <text class="font sub-desc" x="798" y="453">TurboQuant：旋转/残差混合量化</text>

  <!-- Arrows: Core -> Bottom Left (Compute) & Bottom Right (Storage) -->
  <line class="arrow" x1="252" y1="494" x2="252" y2="526" />
  <text class="font edge-label" x="332" y="514">模型前向与融合算子调用</text>

  <line class="bi-arrow" x1="708" y1="498" x2="708" y2="526" />
  <text class="font edge-label" x="792" y="514">按需权重读取 / 检查点落盘</text>

  <!-- ==================== 3A. Bottom Left: 模型网络与硬件加速算子层 ==================== -->
  <rect class="layer-box" x="36" y="528" width="432" height="118" fill="#fff7ed" stroke="#fdba74" />
  <text class="font layer-title" x="252" y="549" fill="#c2410c">模型网络与硬件加速算子层 (GPU / CPU)</text>

  <rect class="sub-box" x="52" y="561" width="194" height="70" stroke="#fed7aa" />
  <text class="font sub-title" x="149" y="583">多模态模型主干网络</text>
  <text class="font sub-desc" x="149" y="602">视觉编码器 · 语言 Transformer</text>
  <text class="font sub-desc" x="149" y="618">多维旋转位置编码 (M-RoPE)</text>

  <rect class="sub-box" x="258" y="561" width="194" height="70" stroke="#fed7aa" />
  <text class="font sub-title" x="355" y="583">定制 CUDA 加速算子</text>
  <text class="font sub-desc" x="355" y="602">KIVI / TurboQuant 融合 GEMV 核</text>
  <text class="font sub-desc" x="355" y="618">W4A16 权重与低比特缓存直接计算</text>

  <!-- ==================== 3B. Bottom Right: 持久化存储与诊断层 ==================== -->
  <rect class="layer-box" x="492" y="528" width="432" height="118" fill="#f1f5f9" stroke="#94a3b8" />
  <text class="font layer-title" x="708" y="549" fill="#334155">持久化存储与运行时诊断层 (本地存储 I/O)</text>

  <rect class="sub-box" x="508" y="561" width="194" height="70" stroke="#cbd5e1" />
  <text class="font sub-title" x="605" y="583">按需权重与异步检查点存储</text>
  <text class="font sub-desc" x="605" y="602">按模块/按层权重读取 · 独立 I/O 线程</text>
  <text class="font sub-desc" x="605" y="618">分块顺序落盘 · 系统页缓存主动回收</text>

  <rect class="sub-box" x="714" y="561" width="194" height="70" stroke="#cbd5e1" />
  <text class="font sub-title" x="811" y="583">运行时剖析与诊断</text>
  <text class="font sub-desc" x="811" y="602">各阶段耗时打点与吞吐统计</text>
  <text class="font sub-desc" x="811" y="618">显存峰值监控 · 会话元数据检视</text>
</svg>
